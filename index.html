      <header class="sidebar-head">
        <div class="hslu-brand" aria-label="HSLU Hochschule Luzern">
          <img src="assets/hslu-logo.svg" alt="HSLU Hochschule Luzern" class="hslu-logo">
        </div>
        <h1>Notenrechner</h1>
      </header>

      <section class="study">
        <h2>Studienziel</h2>
        <div class="study-average" id="studyAverage">Noch keine abgeschlossenen Module</div>
        <label class="target-control study-target">
          <span>Wunschnote</span>
          <select id="studyTarget"></select>
        </label>
      </section>

      <div class="hero-stats" id="studyStats"></div>
    </aside>

    <main class="content">
      <details id="cloud-panel" class="panel cloud-panel">
        <summary>Konto und Synchronisation</summary>
        <form id="cloud-login">
          <label>E-Mail <input id="cloud-email" type="email" required autocomplete="email"></label>
          <label>Passwort <input id="cloud-password" type="password" required autocomplete="current-password"></label>
          <button class="btn btn-primary">Anmelden</button>
          <button type="submit" value="register" class="btn">Registrieren</button>
        </form>
        <div id="cloud-account" hidden>
          <span id="cloud-user"></span>
          <button id="cloud-refresh" class="btn">Kontostand laden</button>
          <button id="cloud-import" class="btn" hidden>Lokale Noten übernehmen</button>
          <button id="cloud-retry" class="btn" hidden>Speichern wiederholen</button>
          <button id="cloud-exit" class="btn">Abmelden</button>
        </div>
        <p id="cloud-status" role="status">Lokaler Modus</p>
      </details>
      <section class="main-actions">
        <h2>Meine Semester</h2>
        <button class="btn btn-primary" id="addSemesterBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Semester erstellen</button>
      </section>

      <section id="semesterContainer" class="semester-container"></section>

      <section class="empty-state panel" id="emptyState" hidden>
        <span class="empty-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M12 13v5M9.5 15.5h5"/></svg></span>
        <h2>Noch kein Semester</h2>
        <button class="btn btn-primary" id="emptyAddSemesterBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Erstes Semester erstellen</button>
      </section>
    </main>
  </div>

  <dialog id="semesterDialog" class="modal">
    <form class="modal-card small-card" id="semesterForm">
      <div class="modal-header">
        <h2>Semester erstellen</h2>
        <button class="icon-btn" type="button" data-close-dialog="semesterDialog" aria-label="Dialog schliessen"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <label class="field-control">
        <span>Name des Semesters</span>
        <input id="semesterName" required autocomplete="off" placeholder="z. B. HS 2026">
      </label>
      <label class="field-control">
        <span>Wunschnote für dieses Semester</span>
        <select id="semesterTarget"></select>
      </label>
      <button type="submit" class="btn btn-primary full-width-btn">Semester erstellen</button>
    </form>
  </dialog>

  <dialog id="moduleDialog" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="moduleDialogTitle">Modul auswählen</h2>
        <button class="icon-btn" type="button" data-close-dialog="moduleDialog" aria-label="Dialog schliessen"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>

      <div class="tab-row" role="tablist">
        <button class="tab-btn active" data-tab="catalog" type="button">Modulkatalog</button>
        <button class="tab-btn" data-tab="custom" type="button">Eigenes Modul</button>
      </div>

      <div class="tab-panel active" id="catalogTab">
        <label class="search-field">
          <span class="visually-hidden">Module durchsuchen</span>
          <input id="moduleSearch" type="search" placeholder="Name oder Modulnummer">
        </label>
        <p id="catalogStatus" role="status"></p>
        <button id="refreshCatalog" class="btn btn-small" type="button">Katalog aktualisieren</button>
        <div id="catalogList" class="catalog-list"></div>
        <button id="moreCatalog" class="btn btn-small" type="button" hidden>Weitere Module laden</button>
      </div>

      <form class="tab-panel" id="customTab">
        <div class="form-grid">
          <label class="full-width">
            <span>Modulname</span>
            <input id="customName" required placeholder="z. B. Wahlmodul">
          </label>
          <label>
            <span>Modulnummer</span>
            <input id="customCode" placeholder="Optional">
          </label>
          <label>
            <span>ECTS</span>
            <input id="customEcts" type="number" min="0.5" max="60" step="0.5" value="3" required>
          </label>
          <label class="full-width">
            <span>Wunschmodulnote</span>
            <select id="customTarget"></select>
          </label>
        </div>
        <button type="submit" class="btn btn-primary full-width-btn">Eigenes Modul hinzufügen</button>
      </form>
    </div>
  </dialog>

  <dialog id="confirmDialog" class="modal confirm-modal">
    <div class="modal-card small-card">
      <span class="confirm-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2M6.5 7l.8 12a2 2 0 0 0 2 1.8h5.4a2 2 0 0 0 2-1.8l.8-12M10 11v6M14 11v6"/></svg></span>
      <h2 id="confirmTitle">Bestätigen</h2>
      <p id="confirmText"></p>
      <div class="confirm-actions">
        <button class="btn" id="confirmCancel" type="button">Abbrechen</button>
        <button class="btn btn-danger" id="confirmOk" type="button">Löschen</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/supabase.js"></script>
  <script src="cloud.js"></script>
  <script src="modules.js"></script>
  <script src="script.js"></script>
</body>
</html>
